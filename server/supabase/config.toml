project_id = "fresava-development"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
major_version = 17
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[auth]
enabled = true
site_url = "http://localhost:3005"
additional_redirect_urls = ["http://localhost:3005/auth/callback", "http://localhost:3005/admin/auth/callback", "http://localhost:3005/staff/auth/callback"]
jwt_expiry = 900
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
[auth.email]
enable_signup = true
enable_confirmations = true
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"
